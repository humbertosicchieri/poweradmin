version: '3.8'

services:
  # Web App - Site do repositório
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000
      - VITE_GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./web/src:/app/src
    networks:
      - poweradmin-net
    depends_on:
      - api

  # API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/poweradmin
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=poweradmin
      - GITHUB_OWNER=humbertosicchieri
    depends_on:
      - db
    networks:
      - poweradmin-net

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=poweradmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - poweradmin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N - Automação e sincronização
  n8n:
    image: n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - WEBHOOK_URL=http://n8n:5678/
    depends_on:
      - db
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    networks:
      - poweradmin-net

volumes:
  postgres_data:
  n8n_data:

networks:
  poweradmin-net:
    driver: bridge
